<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘의 MBTI 운세</title>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--ink:#222;--muted:#777;--line:#ded7cb;--accent:#222}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:28px 18px 60px}.brand{font-size:12px;letter-spacing:.18em;color:#777;text-transform:uppercase;margin-bottom:28px}
h1{font-size:38px;line-height:1.12;margin:0 0 10px}.sub{color:var(--muted);line-height:1.7;margin-bottom:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.progress{height:7px;background:#e8e1d6;border-radius:99px;overflow:hidden;margin:0 0 24px}.progress i{display:block;height:100%;background:#222;width:0;transition:.25s}
.qno{font-size:13px;color:#888;margin-bottom:10px}.question{font-size:23px;font-weight:750;line-height:1.4;margin-bottom:22px}.choices{display:grid;gap:12px}.btn{width:100%;border:1px solid #cfc7bb;background:#fff;border-radius:15px;padding:16px 18px;font-size:16px;text-align:left;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);border-color:#555}.start{background:#222;color:#fff;text-align:center;font-weight:700}
.hidden{display:none}.resultHead{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;border-bottom:1px solid var(--line);padding-bottom:18px}.type{font-size:44px;font-weight:900;letter-spacing:-.04em}.score{font-size:15px;color:#777}.score b{font-size:28px;color:#222}.message{font-size:21px;font-weight:700;line-height:1.55;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f5f0e7;border-radius:15px;padding:15px}.metric span{display:block;font-size:12px;color:#777}.metric b{font-size:25px}.lucky{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:9px}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;text-align:center}.note{font-size:12px;color:#999;line-height:1.5;margin-top:18px;text-align:center}@media(max-width:520px){h1{font-size:32px}.card{padding:20px}.question{font-size:20px}.type{font-size:38px}}
</style>
</head>
<body><main class="wrap">
<div class="brand">DAILY TYPE</div>
<section id="intro"><h1>나는 어떤 타입이고,<br>오늘은 어떤 날일까?</h1><p class="sub">16개의 조금 이상한 상황을 골라보세요. 뭘 재는지는 숨겨뒀습니다. 마지막에는 오늘의 운세까지 이어집니다.</p><div class="card"><button class="btn start" onclick="start()">검사 시작하기 →</button><p class="note">약 2분 · 정답 없음 · 4문항은 운세에만 몰래 반영됩니다.</p></div></section>
<section id="quiz" class="hidden"><div class="card"><div class="progress"><i id="bar"></i></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="choices"><button class="btn" id="a" onclick="answer(0)"></button><button class="btn" id="b" onclick="answer(1)"></button></div></div></section>
<section id="result" class="hidden"><div class="card"><div class="resultHead"><div><div class="qno">TODAY'S TYPE</div><div class="type" id="type"></div></div><div class="score">오늘의 운세 <b id="total"></b></div></div><div class="message" id="message"></div><div class="grid"><div class="metric"><span>❤️ 연애운</span><b id="love"></b></div><div class="metric"><span>💰 금전운</span><b id="money"></b></div><div class="metric"><span>💼 일·공부운</span><b id="work"></b></div></div><div class="lucky"><div>☕ 오늘의 커피: <b id="coffee"></b></div><div>🎯 오늘의 행동: <b id="action"></b></div><div>🎨 행운의 색: <b id="color"></b></div>
<div>📍 행운의 장소: <b id="place"></b></div>
<div>🧿 행운의 아이템: <b id="item"></b></div>
<div>🔢 행운의 숫자: <b id="number"></b></div></div><div class="actions"><button class="btn" onclick="location.reload()">다시 하기</button><button class="btn start" onclick="shareResult()">결과 공유</button></div><p class="note">MBTI 공식 진단이 아닌 간이 성향 테스트이며, 운세는 엔터테인먼트용입니다.</p></div></section>
</main>
<script>
const qs=[
['친구가 갑자기 “나 오늘 회사 때려쳤다”고 카톡을 보냈습니다.', '일단 만나. 어디야?','뭔 일 있었는데? 왜 그만뒀어?','E','I'],
['여행 마지막 날. 비행기까지 6시간이 남았습니다.', '못 가본 곳 하나라도 더 간다','근처 괜찮은 곳에서 천천히 시간을 보낸다','E','I'],
['처음 간 모임에서 아는 사람이 딱 한 명뿐입니다.', '그 한 명을 발판 삼아 다른 사람들과도 섞인다','일단 그 한 명 옆이 제일 편하다','E','I'],
['10년 전의 나에게 문자 딱 한 줄을 보낼 수 있습니다.', '미래에 실제로 도움 될 정보를 보낸다','그때의 나에게 꼭 해주고 싶었던 말을 보낸다','S','N'],
['길을 걷다가 오래된 건물 하나를 발견했습니다.', '언제 지었고 원래 뭐였는지 궁금하다','여기서 무슨 일이 있었을지 상상하게 된다','S','N'],
['새로운 기계를 샀는데 설명서가 꽤 두껍습니다.', '필요한 부분부터 찾아 읽고 쓴다','일단 만져보면서 기능을 발견한다','S','N'],
['친구가 30만원짜리 신발을 사고 “어때?”라고 묻는데 솔직히 별로입니다.', '가격 생각하면 나는 좀 애매한 것 같다고 말한다','본인이 마음에 들어 하면 좋은 점부터 말해준다','T','F'],
['팀원이 실수해서 일이 30분 더 늘어났습니다.', '왜 이런 일이 생겼는지부터 확인한다','당황했을 사람 상태부터 살핀다','T','F'],
['친한 사람이 같은 고민을 세 번째 반복해서 털어놓습니다.', '이번엔 진짜 바꿀 방법을 같이 정한다','그래도 일단 끝까지 들어준다','T','F'],
['내일 갑자기 하루가 통째로 비었습니다.', '오? 뭐 하지? 대충이라도 계획을 잡는다','개이득. 내일의 나에게 맡긴다','J','P'],
['맛집에 갔는데 웨이팅이 70분입니다.', '기다리기로 했으면 그냥 기다린다','근처 다른 괜찮은 집을 바로 찾는다','J','P'],
['집을 나왔는데 원래 가려던 길이 공사 중입니다.', '가장 빠른 우회로부터 찾는다','어차피 이렇게 된 거 다른 길로 가본다','J','P'],
['붕어빵을 받았습니다. 어디부터 먹습니까?', '머리부터','꼬리부터','LUCK_HEAD','LUCK_TAIL'],
['카페에서 주문한 음료가 생각보다 너무 맛있습니다.', '다음에도 똑같은 걸 시킨다','다음엔 다른 것도 잘할 것 같아서 바꿔본다','LUCK_REPEAT','LUCK_EXPLORE'],
['엘리베이터에 혼자 탔는데 닫힘 버튼을 눌렀습니다. 멀리서 누군가 뛰어옵니다.', '열림 버튼을 누른다','잠깐 고민하는 사이 문이 닫힌다','LUCK_OPEN','LUCK_TIMING'],
['오늘 길에서 5천원을 주웠습니다. 주인을 찾기 어려운 상황이라면?', '왠지 좋은 일에 써야 할 것 같다','일단 내 지갑에 넣고 생각한다','LUCK_GIVE','LUCK_KEEP']
];
let idx=0, score={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}, luck=[];
function start(){document.querySelector('#intro').classList.add('hidden');document.querySelector('#quiz').classList.remove('hidden');render()}
function render(){let q=qs[idx];qno.textContent=`QUESTION ${idx+1} / ${qs.length}`;question.textContent=q[0];a.textContent=q[1];b.textContent=q[2];bar.style.width=`${idx/qs.length*100}%`}
function answer(n){let q=qs[idx], key=q[n+3];if(key.startsWith('LUCK_')) luck.push(key); else score[key]++;idx++;if(idx<qs.length)render();else finish()}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(seed,min,max){return min+(seed%(max-min+1))}
function finish(){let type=(score.E>=score.I?'E':'I')+(score.S>=score.N?'S':'N')+(score.T>=score.F?'T':'F')+(score.J>=score.P?'J':'P');let d=new Date();let date=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let h=hash(type+date+luck.join('|'));let total=seeded(h,68,96),love=seeded(h>>>2,60,98),money=seeded(h>>>5,58,96),work=seeded(h>>>8,62,99);
const msgs={E:'사람과의 대화 속에서 생각보다 좋은 힌트를 얻을 수 있는 날입니다.',I:'혼자 정리하는 시간이 오늘의 판단력을 더 선명하게 만들어줍니다.',S:'익숙한 것 하나를 제대로 해내는 것이 새로운 기회를 만듭니다.',N:'평소 지나쳤던 아이디어 하나를 붙잡아보세요. 의외로 쓸모가 있습니다.',T:'감정보다 기준을 세우면 복잡했던 일이 생각보다 쉽게 정리됩니다.',F:'작은 배려 하나가 예상보다 오래 좋은 분위기를 남기는 날입니다.',J:'계획한 일을 하나씩 지우는 것만으로도 만족도가 꽤 높은 날입니다.',P:'예상 밖의 선택 하나가 오늘을 재미있게 바꿀 수 있습니다.'};
const coffees=['Flat White','Aussie Cappuccino','Long Black','Vanilla Latte','Iced Latte','Espresso'];const actions=['평소 안 고르던 메뉴 하나 골라보기','미뤄둔 연락 하나 보내기','10분만 아무 계획 없이 걷기','오늘 할 일 하나를 과감히 빼기','좋아하는 음악 한 곡 크게 듣기','작은 일 하나 오늘 바로 끝내기'];const colors=['Navy','Forest Green','Burgundy','Cream','Charcoal','Cobalt Blue','Olive'];
const places=['창가 자리','동네 서점','강변 산책로','조용한 골목','처음 가보는 카페','공원 벤치','집에서 가장 편한 자리','시장이나 번화가','높은 곳에서 전망이 보이는 곳','햇빛 드는 테라스'];
const items=['볼펜','이어폰','작은 노트','손목시계','텀블러','동전 하나','선글라스','책 한 권','향수','열쇠고리','사진 한 장','좋아하는 컵'];
const luckyNumbers=[1,3,4,7,8,11,13,17,21,24,27,31,33,37,42,44,49,52,64,77,88,91];
document.querySelector('#quiz').classList.add('hidden');document.querySelector('#result').classList.remove('hidden');document.querySelector('#type').textContent=type;document.querySelector('#total').textContent=total;document.querySelector('#love').textContent=love;document.querySelector('#money').textContent=money;document.querySelector('#work').textContent=work;const nick={INTJ:'머릿속에서 이미 세 번 시뮬레이션 끝낸 사람',INTP:'생각하다가 생각의 옆길로 새는 사람',ENTJ:'일단 판부터 짜고 보는 사람',ENTP:'계획은 없는데 이상하게 해결은 하는 사람',INFJ:'사람 마음을 읽다가 본인 마음은 나중에 보는 사람',INFP:'혼자서 서사 한 편 완성하는 사람',ENFJ:'분위기까지 책임지려는 사람',ENFP:'재밌어 보이면 일단 문부터 여는 사람',ISTJ:'정해진 건 제대로 해야 마음이 편한 사람',ISFJ:'티 안 나게 챙길 건 다 챙기는 사람',ESTJ:'결론부터 내고 움직이는 사람',ESFJ:'사람 사이 온도를 잘 맞추는 사람',ISTP:'말보다 일단 해보고 판단하는 사람',ISFP:'내 취향은 조용하지만 확실한 사람',ESTP:'상황 오면 그 자리에서 풀어버리는 사람',ESFP:'오늘 재밌는 게 꽤 중요한 사람'};document.querySelector('#message').textContent=nick[type]+'. '+msgs[type[0]]+' '+msgs[type[3]];document.querySelector('#coffee').textContent=coffees[h%coffees.length];document.querySelector('#action').textContent=actions[(h>>>4)%actions.length];document.querySelector('#color').textContent=colors[(h>>>7)%colors.length];
let place=places[(h>>>10)%places.length], item=items[(h>>>13)%items.length], number=luckyNumbers[(h>>>16)%luckyNumbers.length];
document.querySelector('#place').textContent=place;
document.querySelector('#item').textContent=item;
document.querySelector('#number').textContent=number;
window.resultText=`${type} · 오늘의 운세 ${total}점
❤️ 연애 ${love} · 💰 금전 ${money} · 💼 일 ${work}
📍 행운의 장소: ${place}
🧿 행운의 아이템: ${item}
🔢 행운의 숫자: ${number}
☕ 오늘의 커피: ${document.querySelector('#coffee').textContent}`}"

async function shareResult(){try{if(navigator.share)await navigator.share({title:'오늘의 MBTI 운세',text:window.resultText});else{await navigator.clipboard.writeText(window.resultText);alert('결과를 복사했습니다.')}}catch(e){}}
</script></body></html>
